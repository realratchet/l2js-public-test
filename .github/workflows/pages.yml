name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rsync -a --exclude /.git --exclude /.github --exclude /.gitignore --exclude /README.md --exclude /build ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@v5
      # Named per attempt so a re-run does not find the earlier attempt's artifact too.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          name: github-pages-${{ github.run_attempt }}

  # A separate job, so the artifact is listed by the time deploy-pages looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          curl -sS --fail -o /dev/null -w 'Cloudflare purge: HTTP %{http_code}\n' \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["legacy.ratchet.lt"]}'
